site_name: Operating System Notes
site_url: https://github.com/VinayaSri22/Operating-System-Notes/
site_author: Vinaya Sri Gangavarapu
site_description: >-
  Notes and learning materials for Operating Systems, based on the Neso Academy course.
github_repo: https://github.com/VinayaSri22/Operating-System

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.path
    - content.tooltips
  palette:
    - scheme: default
      primary: brown
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: dark blue
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - mike
  - search:
      position: navbar

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/regular/envelope
      name: Email
      link: mailto:gangavarapuvinayasri14@gmail.com
    - icon: fontawesome/brands/youtube
      name: Neso Academy OS Course
      link: https://www.youtube.com/playlist?list=PLBlnK6fEyqRiVhbXDGLXDk_OQAeuVcp2O

docs_dir: docs/
